services:
  postgres:
    image: postgres:16-alpine
    container_name: mlflow_postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-mlflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlflow_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-mlflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - mlflow_backend

  create_minio_bucket:
    image: minio/mc:latest
    container_name: mlflow_create_bucket
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MLFLOW_BUCKET_NAME: ${MLFLOW_BUCKET_NAME:-mlflow}
    networks:
      - mlflow_backend
    entrypoint: >
      /bin/sh -c '
      until /usr/bin/mc alias set local http://minio:9000
      "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
        echo "Esperando a MinIO...";
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/"$${MLFLOW_BUCKET_NAME}";
      /usr/bin/mc anonymous set none local/"$${MLFLOW_BUCKET_NAME}";
      echo "Bucket $${MLFLOW_BUCKET_NAME} listo";
      exit 0;
      '
    restart: "no"

  mlflow:
    build:
      context: ./dockerfiles/mlflow
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-3.14.0}
    image: mlflow-airline:${MLFLOW_VERSION:-3.14.0}
    container_name: mlflow_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      create_minio_bucket:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ENDPOINT_URL_S3: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-mlflow_db}
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME:-mlflow}
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    networks:
      - mlflow_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  training:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/training/Dockerfile

    image: airline-training:latest
    container_name: airline_training
    restart: unless-stopped

    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mlops-local}
      PYTHONPATH: /workspace

    volumes:
      - ..:/workspace

    working_dir: /workspace

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=${JUPYTER_TOKEN:-mlops-local}

    networks:
      - mlflow_backend

  api:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/api/Dockerfile

    image: airline-api:latest
    container_name: airline_api
    restart: unless-stopped

    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: airline_satisfaction_without_scores
      MODEL_ALIAS: champion

    networks:
      - mlflow_backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/frontend/Dockerfile
    image: airline-frontend:latest
    container_name: airline_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mlflow_backend

  airflow_postgres:
    image: postgres:16-alpine
    container_name: airflow_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    networks:
      - mlflow_backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  
  airflow-init:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/airflow/Dockerfile

    image: airline-airflow:3.3.0
    container_name: airflow_init

    depends_on:
      airflow_postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow

    command: db migrate

    networks:
      - mlflow_backend

    restart: "no"

  airflow-api-server:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/airflow/Dockerfile

    image: airline-airflow:3.3.0
    container_name: airflow_api_server
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__API__SECRET_KEY: airline-airflow-local-secret
      AIRFLOW__API_AUTH__JWT_SECRET: airline-airflow-local-jwt-secret

    command: api-server

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    networks:
      - mlflow_backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  airflow-scheduler:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/airflow/Dockerfile

    image: airline-airflow:3.3.0
    container_name: airflow_scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      api:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__API__SECRET_KEY: airline-airflow-local-secret
      AIRFLOW__API_AUTH__JWT_SECRET: airline-airflow-local-jwt-secret

      MLFLOW_TRACKING_URI: http://mlflow:5000

      PYTHONPATH: /workspace

    command: scheduler

    working_dir: /workspace

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../src:/workspace/src
      - ../data:/workspace/data
      - airflow_logs:/opt/airflow/logs

    networks:
      - mlflow_backend

    dns:
      - 8.8.8.8
      - 1.1.1.1

  airflow-dag-processor:
    build:
      context: ..
      dockerfile: mlflow_system/dockerfiles/airflow/Dockerfile

    image: airline-airflow:3.3.0
    container_name: airflow_dag_processor
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      AIRFLOW__API__SECRET_KEY: airline-airflow-local-secret
      AIRFLOW__API_AUTH__JWT_SECRET: airline-airflow-local-jwt-secret

    command: dag-processor

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    networks:
      - mlflow_backend
      
networks:
  mlflow_backend:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  airflow_postgres_data:
  airflow_logs:
